<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/libs/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/libs/bootstrap.min.css">
    <link rel="stylesheet" href="./popup.css" />

    <title data-loc="AppName"></title>
</head>

<body class="flex-n-grow">
    <popup-page class="flex-n-grow">
        <header class="page-header p-3 hstack gap-1">
            <a class="main-logo" data-url="/">
                <img src="/img/logo.svg" />
            </a>

            <md-filled-icon-button data-url="/recorder" class="ms-auto" data-loc-attr="title"
                data-loc-title="RecordDrive">
                <md-icon><i class="fab fa-google-drive"></i></md-icon>
            </md-filled-icon-button>
            <md-filled-icon-button data-url="/tutorial" data-loc-attr="title" data-loc-title="Tutorial">
                <md-icon><i class="fa-regular fa-circle-question"></i></md-icon>
            </md-filled-icon-button>
        </header>

        <main class="flex-n-grow">
            <md-tabs class="tabs-mode mb-3" data-step="1">
                <md-primary-tab data-src="Screen">
                    <i class="fa-solid fa-display" slot="icon"></i>
                    <span data-loc="ScreenSrcs"></span>
                </md-primary-tab>

                <md-primary-tab data-src="Camera">
                    <i class="fa-solid fa-camera" slot="icon"></i>
                    <span data-loc="CameraSrc"></span>
                </md-primary-tab>
            </md-tabs>

            <div class="container-fluid vstack gap-3">
                <div class="vstack gap-3" data-step="1">
                    <label class="md-card p-3 hstack gap-3">
                        <md-elevation></md-elevation>

                        <md-switch class="chk-mic"></md-switch>
                        <div>
                            <p class="mb-1">
                                <i class="fa-solid fa-microphone"></i>
                                <span data-loc="RecordVoice"></span>
                            </p>
                            <p class="mb-1">
                                <span data-loc="RecordVoiceExpl"></span>
                            </p>
                        </div>
                    </label>

                    <label class="pnl-sys-sound md-card p-3 hstack gap-3">
                        <md-elevation></md-elevation>

                        <md-switch class="chk-sys" selected disabled></md-switch>
                        <div>
                            <p class="mb-1">
                                <i class="fa-solid fa-volume-high"></i>
                                <span data-loc="RecordSys"></span>
                            </p>
                            <p class="mb-0">
                                <span data-loc="RecordSysExpl"></span>
                            </p>
                        </div>
                    </label>

                    <div class="row mt-3">
                        <md-outlined-text-field data-loc-attr="label" data-loc-label="Countdown" type="number"
                            suffix-text="s" value="3" class="txt-countdown text-end col-4" min="0" step="1">
                            <i class="fa-regular fa-clock" slot="leading-icon"></i>
                        </md-outlined-text-field>
                        <md-outlined-select class="cbo-quality col-8" data-loc-attr="label"
                            data-loc-label="RecordQuality">
                            <i class="fa-regular fa-image" slot="leading-icon"></i>
                        </md-outlined-select>
                    </div>

                    <md-fab variant="primary" size="large" class="btn-record w-100" data-loc-attr="label"
                        data-loc-label="RecordDesktop">
                        <i slot="icon" class="fa-solid fa-record-vinyl"></i>
                    </md-fab>
                </div>

                <div class="vstack gap-3 align-items-end" data-step="2">
                    <div class="fs-1 lbl-timer text-center w-100">
                        00:00:00
                    </div>

                    <div class="mt-auto"></div>

                    <md-fab class="btn-pause" data-loc-attr="title" data-loc-title="Pause">
                        <i class="fa-solid fa-pause" slot="icon"></i>
                    </md-fab>

                    <md-fab class="btn-resume" data-loc-attr="title" data-loc-title="Resume">
                        <i class="fa-solid fa-forward-step" slot="icon"></i>
                    </md-fab>

                    <md-fab variant="primary" size="large" class="btn-stop" data-loc-attr="label"
                        data-loc-label="StopRecording">
                        <i slot="icon" class="fa-solid fa-stop"></i>
                    </md-fab>
                </div>

                <div data-step="3" class="vstack align-items-end gap-5">
                    <div class="mt-auto"></div>

                    <md-elevated-button class="btn-reload">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span data-loc="RecordAnother"></span>
                    </md-elevated-button>

                    <md-fab variant="tertiary" size="large" class="btn-save" data-loc-attr="title" data-loc-title="SaveRecording">
                        <i slot="icon" class="fa-solid fa-download"></i>
                    </md-fab>
                </div>

                <md-divider></md-divider>

                <md-elevated-button class="lnk-rate" target="_blank">
                    <i class="fa-regular fa-star"></i>
                    <span data-loc="RateUs"></span>
                </md-elevated-button>
            </div>
        </main>

        <md-dialog class="diag-perm">
            <form id="frm-perm" slot="content" method="dialog">
                <div class="text-center">
                    <p class="fs-1">
                        <i class="fa-solid fa-microphone-slash"></i>
                    </p>

                    <span class="lbl-perm-text" data-loc="PermMicDenied"></span>
                </div>
            </form>
            <div slot="actions">
                <md-text-button form="frm-perm" value="">
                    <span data-loc="Cancel"></span>
                </md-text-button>
                <md-filled-button form="frm-perm" class="btn-grant-mic-perm" value="grant">
                    <span data-loc="GrantPerm"></span>
                </md-filled-button>
            </div>
        </md-dialog>
    </popup-page>

    <script type="module" src="/libs/materialweb.min.js"></script>
    <script type="module" src="/js/common/common.js"></script>
    <script type="module" src="/js/PopupPage.js"></script>
    <script type="module" src="/js/FillLinks.js"></script>
    <script type="module" src="/js/common/link.js"></script>
</body>

</html>
